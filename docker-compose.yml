services:
  wset-chatbot:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - LLM_API_KEY=${LLM_API_KEY:?LLM_API_KEY is required}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - ADMIN_SECRET=${ADMIN_SECRET:?ADMIN_SECRET is required}
    volumes:
      # Persist processed data (embedding cache, question banks) across restarts
      - ./data/processed:/app/data/processed
    restart: unless-stopped
